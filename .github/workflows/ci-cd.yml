name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - main

jobs:

  # 1. BUILD JOB (all branches)
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B package -DskipTests


  # 2. DEPLOY DEV (AUTOMATIC)
  deploy_dev:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Railway Dev Deploy Info
        run: |
          echo "Dev branch push olundu → Railway avtomatik deploy edəcək."


  # 3. DEPLOY STAGING (MANUAL APPROVAL)
  deploy_staging:
    needs: build
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://my-app-api-production.up.railway.app

    steps:
      - name: Railway Staging Deploy Info
        run: |
          echo "Staging üçün approval tələb olunur. Approval verən kimi Railway deploy edəcək."


  # 4. DEPLOY PRODUCTION (MANUAL APPROVAL)
  deploy_prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://my-app-api-production.up.railway.app

    steps:
      - name: Railway Prod Deploy Info
        run: |
          echo "Production üçün manual approval ver → Railway deploy edəcək."
