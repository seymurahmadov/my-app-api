name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build
        run: ./mvnw -B package -DskipTests


  deploy_dev:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway
        run: npm i -g @railway/cli

      - name: Login Railway
        run: railway login --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Switch to DEV environment
        run: railway environment switch dev

      - name: Deploy to DEV
        run: railway up --service your-service-name


  deploy_staging:
    needs: deploy_dev
    runs-on: ubuntu-latest
    environment:
      name: staging   # GitHub-da manual approval açılacaq
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway
        run: npm i -g @railway/cli

      - name: Login Railway
        run: railway login --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Switch to STAGING environment
        run: railway environment switch staging

      - name: Deploy to STAGING
        run: railway up --service your-service-name


  deploy_prod:
    needs: deploy_staging
    runs-on: ubuntu-latest
    environment:
      name: production   # Manual approval
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway
        run: npm i -g @railway/cli

      - name: Login Railway
        run: railway login --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Switch to PROD environment
        run: railway environment switch prod

      - name: Deploy to PROD
        run: railway up --service your-service-name
