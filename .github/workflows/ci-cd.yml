name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # 1️⃣ BUILD JOB
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B package -DskipTests

  # 2️⃣ DEPLOY DEV (AUTOMATIC)
  deploy_dev:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Set Railway token
        run: echo "RAILWAY_TOKEN=${{ secrets.RAILWAY_TOKEN }}" >> $GITHUB_ENV

      - name: Deploy to DEV
        run: railway up --service your-service-name --environment dev

  # 3️⃣ DEPLOY STAGING (MANUAL APPROVAL)
  deploy_staging:
    needs: deploy_dev
    runs-on: ubuntu-latest
    environment:
      name: staging  # GitHub-da manual approval açılacaq
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Set Railway token
        run: echo "RAILWAY_TOKEN=${{ secrets.RAILWAY_TOKEN }}" >> $GITHUB_ENV

      - name: Deploy to STAGING
        run: railway up --service your-service-name --environment staging

  # 4️⃣ DEPLOY PROD (MANUAL APPROVAL)
  deploy_prod:
    needs: deploy_staging
    runs-on: ubuntu-latest
    environment:
      name: production  # GitHub-da manual approval açılacaq
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Set Railway token
        run: echo "RAILWAY_TOKEN=${{ secrets.RAILWAY_TOKEN }}" >> $GITHUB_ENV

      - name: Deploy to PROD
        run: railway up --service your-service-name --environment production
