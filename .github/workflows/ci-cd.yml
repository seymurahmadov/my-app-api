name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: ''

      - run: ./mvnw package -DskipTests

  deploy_dev:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Railway Dev
        run: |
          echo "Railway automatically deploys dev branch. Yalnız GitHub push yetərlidir."

  deploy_staging:
    needs: build
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy to Railway Staging
        run: |
          echo "Manual approval on GitHub Environment is needed. Railway deploy will start after approval."

  deploy_prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy to Railway Production
        run: |
          echo "Manual approval on GitHub Environment is needed. Railway deploy will start after approval."
